name: ML CI Pipeline

on:
  push:
    branches: [ main ]

jobs:

  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt


  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run Tests
        run: pytest || echo "No tests, skipping"


  train:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Train Model
        run: python src/train.py


  validate:
    runs-on: ubuntu-latest
    needs: train
    steps:
      - name: Check Model Exists
        run: |
          if [ -f models/sentiment_model.pkl ]; then
            echo "Model exists"
          else
            echo "Model missing" && exit 1
          fi